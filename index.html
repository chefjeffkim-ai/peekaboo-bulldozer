<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>까꿍! 불도저와 중장비 친구들</title>
  <link rel="icon" type="image/png" href="assets/ic_bulldozer_logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Jua&family=Nunito:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell" id="appShell">
    <!-- Top minimal bar (calm, unobtrusive for toddlers) -->
    <header class="top-bar">
      <div class="top-bar-group">
        <button class="pill-btn pill-btn--soft" id="homeBtn" type="button" aria-label="홈으로 가기" hidden>
          <span class="pill-icon" aria-hidden="true">🏠</span>
          <span class="pill-label">홈</span>
        </button>
        <button class="pill-btn pill-btn--soft" id="parentMenuBtn" type="button" aria-label="부모 설정 열기">
          <span class="pill-icon" aria-hidden="true">⚙️</span>
          <span class="pill-label">부모 메뉴</span>
        </button>
        <button class="pill-btn pill-btn--soft" id="assetGalleryBtn" type="button" aria-label="일러스트 에셋 보기">
          <span class="pill-icon" aria-hidden="true">🎨</span>
          <span class="pill-label">에셋 6종</span>
        </button>
      </div>

      <div class="progress-dots" id="progressDots" role="tablist" aria-label="동화책 페이지"></div>

      <button class="pill-btn pill-btn--soft" id="soundToggleBtn" type="button" aria-label="소리 켜기/끄기" aria-pressed="true">
        <span class="pill-icon" id="soundIcon" aria-hidden="true">🔊</span>
        <span class="pill-label" id="soundLabel">소리 켜짐</span>
      </button>
    </header>

    <!-- Main Picture Book Stage -->
    <main class="book-stage" id="bookStage" aria-live="polite"></main>

    <!-- Bottom Giant Toddler-Friendly Navigation -->
    <footer class="bottom-nav" id="bottomNav">
      <button class="nav-btn nav-btn--prev" id="prevBtn" type="button" aria-label="이전 화면">
        <span aria-hidden="true">←</span>
        <span class="nav-btn-text">이전</span>
      </button>

      <button class="nav-btn nav-btn--peek" id="peekToggleBtn" type="button" hidden>
        <span aria-hidden="true">🚪</span>
        <span>까꿍! 다시 숨기</span>
      </button>

      <button class="nav-btn nav-btn--next" id="nextBtn" type="button" aria-label="다음 화면">
        <span class="nav-btn-text" id="nextBtnText">다음</span>
        <span aria-hidden="true">→</span>
      </button>
    </footer>

    <!-- Floating gentle particle layer -->
    <div class="sparkle-layer" id="sparkleLayer" aria-hidden="true"></div>
  </div>

  <!-- Parent Settings Modal (Slow/Normal Voice Speed + Gemini Audio Engine Status) -->
  <div class="modal-backdrop" id="parentModal" hidden>
    <div class="modal-card modal-card--compact" role="dialog" aria-modal="true" aria-labelledby="parentModalTitle">
      <div class="modal-header">
        <div>
          <h2 id="parentModalTitle">부모님 설정 (오디오 &amp; 속도)</h2>
          <p class="modal-subtitle">제미나이(Gemini) 음성 파일 우선 재생 · 미생성 시 원어민 TTS 자동 폴백</p>
        </div>
        <button class="modal-close-btn" id="closeParentModalBtn" type="button" aria-label="닫기">✕</button>
      </div>

      <div class="parent-section">
        <div class="parent-section-label">영어 음성 속도 (playbackRate)</div>
        <div class="speed-toggle-group" role="radiogroup" aria-label="음성 재생 속도">
          <button class="speed-btn" id="speedSlowBtn" type="button" data-speed="slow" role="radio" aria-checked="false">
            <span class="speed-emoji" aria-hidden="true">🐢</span>
            <span>천천히 (Slow · 0.85×)</span>
          </button>
          <button class="speed-btn" id="speedNormalBtn" type="button" data-speed="normal" role="radio" aria-checked="true">
            <span class="speed-emoji" aria-hidden="true">🐇</span>
            <span>보통 (Normal · 1.0×)</span>
          </button>
        </div>
      </div>

      <div class="parent-section">
        <div class="parent-section-label">하이브리드 오디오 엔진 상태</div>
        <div class="audio-status-box" id="audioStatusBox">
          확인 중...
        </div>
      </div>
    </div>
  </div>

  <!-- Asset Gallery Modal -->
  <div class="modal-backdrop" id="assetModal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="assetModalTitle">
      <div class="modal-header">
        <div>
          <h2 id="assetModalTitle">동화책 전용 일러스트 에셋 (6종)</h2>
          <p class="modal-subtitle">따뜻한 미색(#FFFDF7) 파스텔 수채화 · 글자 0% · 고정 파일명</p>
        </div>
        <button class="modal-close-btn" id="closeAssetModalBtn" type="button" aria-label="닫기">✕</button>
      </div>
      <div class="asset-grid" id="assetGrid"></div>
    </div>
  </div>

  <script src="az_data.js"></script>
  <script src="app.js"></script>
</body>
</html>
